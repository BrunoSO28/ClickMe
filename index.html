<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Me</title>
    <link rel="stylesheet" href="styles.css" />
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MQD2TB5Z"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag ('config', 'G-B52GWE9VDH');
    </script>

</head>

<body>
    <audio id="minha-musica" loop>
        <source src="Voyage-Voyage.mp3" type="audio/mpeg">
    </audio>
    <div class="page">   
        <h1 class="cabecario">Você é só curioso ou é pão duro também? 🤣</h1>
        <h2 class="cabecario" id="texto2">Me ajude na minha caixinha de natal</h2>
        <!-- Caixa transparente com a imagem e o botão -->
        <main class="card">
            <button id="toca-musica" class="play">Solta o som DJ</button>
            <picture>
                <source media="(max-width: 700px)" srcset="IMG-mobile.webp" type="image/webp">
                <img src="IMG.png" alt="Duas pessoas apontando para o botão"
                    class="Image1" width="1920" height="1080">
            </picture>
            <a href="https://nubank.com.br/cobrar/x5g3o/6aefd8cf-f699-4e0c-92dc-391ed293a967" class="botao">Clique aqui</a>
        </main>

        <!-- Faixa inferior -->
        <p class="strip">Sem compromisso. Clique e veja o que acontece.</p>
    </div>
    <script>
        const musica = document.getElementById('minha-musica');
        const botao  = document.getElementById('toca-musica');
        musica.volume = 0.3;
        botao.addEventListener('click', () => {
            if (!musica.paused) {      // clicar de novo pausa
                musica.pause();
                botao.textContent = 'Solta o som DJ';
                botao.classList.remove('movido');
                return;
                }
            else { 
                musica.play();
                botao.textContent = 'Segura DJ';
                botao.classList.add('movido');
            } 
            });
    </script>
</body>
</html>
